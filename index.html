<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>focusforest</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#b6c8bf">
<meta name="theme-color" content="#e9d5b5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Kalam:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fff4df; --cream2:#f1dfc4; --pink:#dca6a2; --ink:#47413d;
  --glass:rgba(76,99,91,.49);
  --hand:'Fox in the Snow','Caveat','Segoe Script',cursive;
  --ui:'Fox in the Snow','Kalam','Caveat',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#a6bfb8;color:var(--cream)}
body{display:grid;place-items:center;font-family:var(--ui);font-weight:300;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--pink);outline-offset:3px;border-radius:12px}
[hidden]{display:none!important}
svg{display:block}

/* ---------- frame & absolute layout (design = 1151 x 1367) ---------- */
.frame{position:relative;width:min(100vw,calc(100dvh*1151/1367));aspect-ratio:1151/1367;container-type:inline-size;overflow:hidden;
  box-shadow:0 20px 80px rgba(0,0,0,.5)}
.scene{position:absolute;inset:0;width:100%;height:100%}
.grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.48;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .33  0 0 0 0 .22  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.stage{position:absolute;inset:0;--u:calc(100cqw/1151)}
.view{display:contents}
.a{position:absolute;left:calc(var(--x)*var(--u));top:calc(var(--y)*var(--u));width:calc(var(--w)*var(--u));height:calc(var(--h)*var(--u));font-size:calc(var(--fs,20)*var(--u))}
.k{position:absolute;left:calc(var(--x)*var(--k));top:calc(var(--y)*var(--k));width:calc(var(--w)*var(--k));height:calc(var(--h)*var(--k));font-size:calc(var(--fs,20)*var(--k))}
.hdr{display:contents}

/* painted glass */
.brush{position:relative;isolation:isolate}
.brush::before{content:"";position:absolute;inset:6px;z-index:-1;background:var(--glass);border-radius:var(--r,34px);filter:url(#rough)}
.hand{font-family:var(--hand);font-weight:500}

/* ---------- header ---------- */
.logo{display:flex;align-items:flex-start;gap:calc(14*var(--u));color:var(--cream)}
.logo-t{font-family:var(--hand);font-weight:500;font-size:calc(54*var(--u));line-height:1;font-style:italic;letter-spacing:.5px;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.logo svg{width:calc(38*var(--u));height:calc(38*var(--u));margin-top:calc(6*var(--u))}
.logo i{position:absolute;left:0;right:calc(10*var(--u));bottom:calc(8*var(--u));height:1.5px;background:linear-gradient(90deg,var(--cream),transparent);opacity:.7}
.tag{font-family:var(--hand);font-size:calc(21*var(--u));line-height:1.25;color:var(--cream);opacity:.82;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.nav{display:flex;align-items:center;justify-content:space-around;padding:0 calc(14*var(--u));--r:36px}
.nav button{position:relative;font-family:var(--ui);font-weight:300;font-style:italic;font-size:calc(28*var(--u));color:var(--cream);opacity:.78;padding:calc(6*var(--u)) calc(10*var(--u));letter-spacing:.5px;display:flex;align-items:center;gap:calc(8*var(--u))}
.nav button[aria-selected="true"]{opacity:1}
.nav button[aria-selected="true"]::after{content:"";position:absolute;left:6%;right:6%;bottom:calc(-4*var(--u));height:calc(5*var(--u));border-radius:6px;background:var(--pink);filter:url(#roughSm)}
.live{font-family:var(--ui);font-style:normal;font-size:calc(17*var(--u));color:var(--pink);display:none}
.live.on{display:inline}
.ibtn{display:grid;place-items:center;color:var(--cream);border-radius:50%}
.ibtn svg{width:70%;height:70%;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.avatar{border-radius:50%;border:2px solid rgba(244,232,209,.75);background:linear-gradient(#f0a681 0,#a98aa0 38%,#4a5a46 62%,#2d3a2c 100%);box-shadow:0 2px 12px rgba(0,0,0,.4)}

/* ---------- note ---------- */
.paper{transform:rotate(-3deg);font-family:var(--hand);color:#4a3b2c;display:grid;place-items:center;isolation:isolate;padding:0 calc(22*var(--u))}
.paper::before{content:"";position:absolute;inset:4px;z-index:-1;background:linear-gradient(135deg,#e6d6b3,#cdb88f);filter:url(#rough);box-shadow:inset 0 0 40px rgba(120,90,50,.35)}
.paper p{margin:0;font-size:calc(38*var(--u));line-height:1.12;font-weight:500;text-align:left;width:100%;transform:translateX(calc(-4*var(--u)))}
.paper svg{position:absolute;right:calc(14*var(--u));bottom:calc(10*var(--u));width:calc(44*var(--u));height:calc(44*var(--u));fill:none;stroke:#4a3b2c;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- durations ---------- */
.durs{display:flex;flex-direction:column;gap:calc(8*var(--u))}
.dur{position:relative;flex:1;display:flex;align-items:center;gap:calc(18*var(--u));padding:0 calc(24*var(--u)) 0 calc(26*var(--u));text-align:left;isolation:isolate;color:var(--cream);transition:transform .25s}
.dur::before{content:"";position:absolute;inset:5px;z-index:-1;background:var(--glass);border-radius:36px;filter:url(#rough);transition:background .3s}
.dur.on::before{background:rgba(95,119,103,.7);box-shadow:inset 0 0 0 calc(3.2*var(--u)) var(--cream)}
.dur:not(.on):hover::before{background:rgba(66,58,58,.62)}
.dur[disabled]{cursor:default;opacity:.8}
.dur svg{width:calc(84*var(--u));height:calc(84*var(--u));flex:none;margin-left:calc(-6*var(--u))}
.dur b{display:block;font-family:var(--hand);font-weight:500;font-size:calc(40*var(--u));line-height:1}
.dur span{display:block;font-family:var(--ui);font-style:italic;font-size:calc(21*var(--u));opacity:.9;margin-top:calc(2*var(--u))}

/* ---------- timer cluster (own unit --k = 1/530 of cluster) ---------- */
.cluster{container-type:inline-size;--k:calc(100cqw / 530);pointer-events:none}
.cluster>*{pointer-events:auto}
.ring{border-radius:50%;background:radial-gradient(circle at 50% 40%,rgba(67,94,90,.32),rgba(56,83,81,.48));display:grid;place-items:center;text-align:center}
.ring svg.rsvg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .num{font-family:var(--hand);font-weight:400;font-size:calc(70*var(--k));line-height:1;letter-spacing:2px;color:var(--cream);text-shadow:0 2px 14px rgba(0,0,0,.5);margin-top:calc(-48*var(--k))}
.ring .lbl{font-family:var(--ui);font-style:italic;font-size:calc(21*var(--k));color:var(--cream);margin-top:0;position:absolute;left:5%;right:5%;top:64%;line-height:1.3;text-align:center;white-space:nowrap}
.ring .txt{position:absolute;inset:0;display:grid;place-items:center}
.tree-box{pointer-events:none!important}
.tree-box .layer{position:absolute;inset:0}
.tree-box svg{width:100%;height:100%;overflow:visible}
.tsvg{transition:--s 1.2s linear,--c 1.2s linear,--sp .8s ease,opacity 2.4s ease,filter 2.4s ease}
@property --s{syntax:'<number>';inherits:true;initial-value:1}
@property --c{syntax:'<number>';inherits:true;initial-value:1}
@property --sp{syntax:'<number>';inherits:true;initial-value:0}
.tsvg.wilt{opacity:0;filter:saturate(.1) brightness(.6)}
.dead-layer{opacity:0;transition:opacity 2.4s ease .4s}
.dead-layer.on{opacity:1}
.tsvg.bounce{animation:bounce .9s ease}
@keyframes bounce{30%{transform:scale(1.04) translateY(-6px)}100%{transform:none}}
.island{pointer-events:none!important}
.btn-start{display:flex;align-items:center;justify-content:center;gap:calc(14*var(--k));color:#3b2f27;font-family:var(--hand);font-weight:500;font-size:calc(34*var(--k));isolation:isolate;transition:transform .2s}
.btn-start::before{content:"";position:absolute;inset:3px;z-index:-1;border-radius:calc(40*var(--k));background:linear-gradient(135deg,#fff2d5,#ead4b7);filter:url(#rough);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.btn-start:hover:not([disabled]){transform:translateY(-2px)}
.btn-start[disabled]{opacity:.62;cursor:default}
.btn-start svg{width:calc(26*var(--k));height:calc(26*var(--k));fill:#3b2f27}
.petals{position:absolute;pointer-events:none!important;overflow:hidden}
.petals i{position:absolute;top:-8%;width:calc(11*var(--k));height:calc(8*var(--k));border-radius:100% 0 100% 0;background:#f7bfca;opacity:0;animation:fall linear infinite}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:.9}100%{opacity:0;transform:translate(calc(60*var(--k)),calc(300*var(--k))) rotate(420deg)}}

.quote{font-family:var(--hand);font-weight:400;font-size:calc(36*var(--u));line-height:1.1;transform:rotate(-11deg);color:var(--cream);text-shadow:0 1px 10px rgba(80,30,30,.4);pointer-events:none}
.quote svg{width:80%;height:calc(16*var(--u));margin-top:calc(8*var(--u));margin-left:calc(40*var(--u));stroke:var(--cream);fill:none;opacity:.8}
.ctrl{display:flex;justify-content:center;gap:calc(52*var(--u))}
.rbtn{display:flex;flex-direction:column;align-items:center;gap:calc(8*var(--u));font-family:var(--ui);font-style:italic;font-size:calc(20*var(--u));color:var(--cream);opacity:.9;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.rbtn .c{width:calc(66*var(--u));height:calc(66*var(--u));border-radius:50%;background:rgba(91,112,106,.65);display:grid;place-items:center;border:1px solid rgba(244,232,209,.18);transition:background .25s,transform .2s;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.rbtn:hover:not([disabled]) .c{background:rgba(96,84,80,.74);transform:translateY(-2px)}
.rbtn[disabled]{opacity:.42;cursor:default}
.rbtn svg{width:46%;height:46%;fill:none;stroke:var(--cream);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ---------- forest panel ---------- */
.fpanel{--r:30px}
.fp-title{font-family:var(--hand);font-weight:500;font-size:calc(40*var(--u));display:flex;gap:calc(12*var(--u));align-items:center;color:var(--cream)}
.fp-title svg,.ficon{fill:none;stroke:var(--cream);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.fp-title svg{width:calc(34*var(--u));height:calc(34*var(--u))}
.fp-title::after{content:"";position:absolute;left:0;bottom:calc(-6*var(--u));width:calc(220*var(--u));height:1.5px;background:linear-gradient(90deg,var(--cream),transparent)}
.stats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(14*var(--u));font-family:var(--ui);font-size:calc(22*var(--u));font-style:italic;letter-spacing:.5px}
.stats li{display:flex;align-items:center;gap:calc(18*var(--u))}
.stats .ic{width:calc(30*var(--u));height:calc(30*var(--u));border-radius:50%;border:1px solid rgba(244,232,209,.5);display:grid;place-items:center;flex:none}
.stats .ic svg{width:70%;height:70%}
.fp-forest{cursor:pointer}
.fp-forest svg,.fv-scene svg{width:100%;height:100%;overflow:visible}
.hint{font-family:var(--hand);font-size:calc(30*var(--u));color:var(--cream);transform:rotate(-5deg);display:flex;align-items:center;gap:calc(8*var(--u));justify-content:flex-start;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.hint svg{width:calc(62*var(--u));height:calc(30*var(--u));stroke:var(--cream);fill:none}
.story{font-family:var(--hand);font-size:calc(31*var(--u));line-height:1.1;transform:rotate(-11deg);color:var(--cream);position:relative;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.story svg{position:absolute;right:calc(-8*var(--u));bottom:calc(-52*var(--u));width:calc(40*var(--u));height:calc(40*var(--u));stroke:var(--cream);fill:none;stroke-width:1.2}
.btn-glass{display:flex;align-items:center;gap:calc(14*var(--u));padding:0 calc(28*var(--u));font-family:var(--ui);font-style:italic;font-size:calc(23*var(--u));color:var(--cream);isolation:isolate;transition:transform .2s}
.btn-glass::before{content:"";position:absolute;inset:4px;z-index:-1;border-radius:40px;background:rgba(91,112,106,.65);filter:url(#rough);border:1px solid rgba(244,232,209,.2)}
.btn-glass:hover{transform:translateY(-2px)}
.btn-glass svg{width:calc(38*var(--u));height:calc(38*var(--u));fill:none;stroke:var(--cream);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn-glass.pink{color:#3b2f27}
.btn-glass.pink::before{background:linear-gradient(135deg,#fff2d5,#ead4b7);border:0}

.dots{display:flex;gap:calc(14*var(--u));align-items:center;justify-content:center}
.dots button{width:calc(14*var(--u));height:calc(14*var(--u));border-radius:50%;background:rgba(244,232,209,.45);transition:background .3s,transform .3s}
.dots button[aria-current="true"]{background:var(--pink);transform:scale(1.15)}

/* ---------- forest tab ---------- */
.fv-scene{cursor:default}
.fv-ctrl{display:flex;align-items:center;gap:calc(26*var(--u));font-family:var(--ui);font-style:italic;font-size:calc(23*var(--u));text-shadow:0 1px 8px rgba(0,0,0,.5)}
.fv-ctrl .btn-glass{height:calc(62*var(--u));position:relative}
.fv-ctrl .chips{display:flex;gap:calc(22*var(--u));flex-wrap:wrap;color:var(--cream)}
.panel{padding:calc(34*var(--u)) calc(40*var(--u))}
.panel h2{font-family:var(--hand);font-weight:500;font-size:calc(42*var(--u));margin:0 0 calc(14*var(--u));line-height:1}
.panel p{margin:0;font-size:calc(22*var(--u));line-height:1.45;font-style:italic}
.fv-info{display:flex;flex-direction:column}
.fv-info .big{width:calc(190*var(--u));height:calc(210*var(--u));margin:0 auto calc(6*var(--u))}
.fv-info .big svg{width:100%;height:100%;overflow:visible}
.badge{display:inline-block;font-style:normal;font-size:calc(19*var(--u));padding:2px calc(14*var(--u));border-radius:20px;border:1px solid rgba(244,232,209,.5);margin-bottom:calc(10*var(--u))}
.badge.dead{border-color:#d9a07a;color:#e7b894}
.fv-list{overflow:hidden;display:flex;flex-direction:column}
.fv-list .grid{overflow:auto;flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(120*var(--u)),1fr));gap:calc(12*var(--u));padding-right:6px;scrollbar-width:thin;scrollbar-color:rgba(244,232,209,.4) transparent}
.tile{display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(8*var(--u)) calc(4*var(--u));border-radius:18px;border:1px solid transparent;font-size:calc(17*var(--u));font-style:italic;line-height:1.25;transition:background .2s}
.tile:hover{background:rgba(244,232,209,.08)}
.tile.on{border-color:rgba(244,232,209,.6);background:rgba(244,232,209,.1)}
.tile svg{width:calc(84*var(--u));height:calc(92*var(--u));overflow:visible}
.tile.dead svg{opacity:.85}
.tile small{display:block;opacity:.7;font-size:calc(15*var(--u))}

/* ---------- stats tab ---------- */
.bars{display:flex;align-items:flex-end;gap:calc(22*var(--u));height:calc(270*var(--u));margin-top:calc(8*var(--u))}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:calc(8*var(--u));font-style:italic;font-size:calc(20*var(--u))}
.bars .bar{width:62%;max-width:calc(84*var(--u));min-height:calc(6*var(--u));border-radius:16px 16px 6px 6px;background:linear-gradient(#f7b8bd,#e48b98);opacity:.92;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.bars .col.today .bar{background:linear-gradient(#fbe3cd,#f1a2aa);box-shadow:0 0 22px rgba(241,162,170,.45)}
.bars .v{opacity:.85;font-size:calc(18*var(--u));min-height:1.2em}
.tiles{display:flex;gap:calc(22*var(--u))}
.tile2{flex:1;padding:calc(20*var(--u)) calc(14*var(--u));text-align:center;display:flex;flex-direction:column;justify-content:center}
.tile2 b{font-family:var(--hand);font-weight:500;font-size:calc(58*var(--u));line-height:1}
.tile2 span{font-style:italic;font-size:calc(20*var(--u));opacity:.9;margin-top:calc(4*var(--u))}
.trow{display:flex;align-items:center;gap:calc(24*var(--u));padding:calc(10*var(--u)) 0;border-bottom:1px solid rgba(244,232,209,.12)}
.trow:last-child{border-bottom:0}
.trow svg{width:calc(100*var(--u));height:calc(110*var(--u));flex:none;overflow:visible}
.trow .nm{width:calc(220*var(--u))}
.trow .nm b{display:block;font-family:var(--hand);font-weight:500;font-size:calc(38*var(--u));line-height:1}
.trow .nm span{font-style:italic;font-size:calc(20*var(--u));opacity:.85}
.trow .meter{flex:1;height:calc(16*var(--u));border-radius:10px;background:rgba(244,232,209,.12);overflow:hidden;display:flex}
.trow .meter i{display:block;height:100%}
.trow .meter .ok{background:linear-gradient(90deg,#f3b0b6,#f1a2aa)}
.trow .meter .no{background:#8a7867}
.trow .cnt{width:calc(150*var(--u));text-align:right;font-style:italic;font-size:calc(21*var(--u))}

/* ---------- toast + modal ---------- */
.toast{position:absolute;left:50%;bottom:calc(60*var(--u));transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:30;
  padding:calc(14*var(--u)) calc(34*var(--u));font-family:var(--hand);font-weight:500;font-size:calc(32*var(--u));color:#3b2f27;white-space:nowrap;isolation:isolate;transition:all .5s cubic-bezier(.2,.9,.3,1.1)}
.toast::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:40px;background:linear-gradient(135deg,#fff2d5,#ead4b7);filter:url(#rough);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad::before{background:linear-gradient(#e8cdb4,#d3a98c)}
.modal{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgba(24,18,24,.5);backdrop-filter:blur(3px)}
.sheet{width:calc(640*var(--u));max-width:92%;padding:calc(44*var(--u)) calc(50*var(--u));--r:40px;--glass:rgba(40,34,38,.9);font-size:calc(22*var(--u))}
.sheet h3{font-family:var(--hand);font-weight:500;font-size:calc(46*var(--u));margin:0 0 calc(10*var(--u))}
.sheet p{margin:0 0 calc(18*var(--u));font-style:italic;line-height:1.45;opacity:.9}
.row{display:flex;align-items:center;justify-content:space-between;gap:calc(20*var(--u));padding:calc(14*var(--u)) 0;border-top:1px solid rgba(244,232,209,.14)}
.row small{display:block;opacity:.7;font-style:italic;font-size:.82em}
.sw-t{width:calc(64*var(--u));height:calc(34*var(--u));border-radius:30px;background:rgba(244,232,209,.18);position:relative;flex:none;transition:background .25s}
.sw-t::after{content:"";position:absolute;left:3px;top:3px;width:calc(28*var(--u));height:calc(28*var(--u));border-radius:50%;background:var(--cream);transition:transform .25s}
.sw-t[aria-checked="true"]{background:var(--pink)}
.sw-t[aria-checked="true"]::after{transform:translateX(calc(30*var(--u)))}
.acts{display:flex;gap:calc(16*var(--u));justify-content:flex-end;margin-top:calc(22*var(--u));flex-wrap:wrap}
.acts button{padding:calc(10*var(--u)) calc(28*var(--u));border-radius:30px;font-family:var(--hand);font-weight:500;font-size:calc(30*var(--u));background:rgba(244,232,209,.12);border:1px solid rgba(244,232,209,.3)}
.acts button.pri{background:var(--cream);color:#3b2f27;border-color:transparent}
.acts button.dng{background:#a5614f;border-color:transparent}

/* ---------- tree animation ---------- */
.ts{transform-origin:0 0;transform:translate(100px,233px) scale(var(--s,1)) translate(-100px,-233px)}
.cn{transform-origin:0 0;transform:translate(100px,105px) scale(var(--c,1)) translate(-100px,-105px)}
.sp{opacity:var(--sp,0)}
.sw{transform-origin:0 0;animation:sway 7s ease-in-out infinite alternate}
.sw.stiff{animation:none}
@keyframes sway{from{transform:translate(100px,234px) rotate(-.9deg) translate(-100px,-234px)}to{transform:translate(100px,234px) rotate(1deg) translate(-100px,-234px)}}
.pop{transform-origin:0 0;animation:pop .9s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes pop{from{opacity:0;transform:translate(100px,233px) scale(0) translate(-100px,-233px)}to{opacity:1;transform:translate(100px,233px) scale(1) translate(-100px,-233px)}}

<script>
/* =========================================================
   focusforest — focus, plant trees, grow your forest
   ========================================================= */
const TYPES={
  birch:{min:20,name:'Young Birch',blurb:'Light and quick to grow; a tree for a short focus session.'},
  sakura:{min:30,name:'Sakura',blurb:'A blossoming tree for thirty peaceful minutes of focus.'},
  oak:{min:60,name:'Ancient Oak',blurb:'A timeless tree for one hour of deep focus.'}
};
const ORDER=['birch','sakura','oak'];
const PREVIEW_SEED={birch:5,sakura:7,oak:11};

/* ---------- helpers ---------- */
function rng(seed){let a=(seed>>>0)||1;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const f1=n=>Math.round(n*10)/10;
const LEAF='<svg viewBox="0 0 24 24" class="ficon"><path d="M5 19C5 9 11 4 20 4c0 9-5 15-13 15z"/><path d="M5 19c3-5 6-8 10-10"/></svg>';

/* ---------- tree art ---------- */
const PAL={
  birch:{leaf:['#628b7b','#81a795','#a3bfa8','#c1d1b1','#dce1c3','#eef0d8'],bark:'#ebe5d6',dead:'#a29c8d'},
  sakura:{leaf:['#b77c85','#cc929a','#deaab0','#e8bec0','#f0d1cd','#f8e5da'],bark:'#5a3a2b',dead:'#4d3f38'},
  oak:{leaf:['#537765','#668d74','#86a287','#a9b99a','#c6cfaa','#e2dec0'],bark:'#6b4d34',dead:'#4d4036'}
};
const SHAPE={
  birch:{cx:100,cy:94,rx:33,ry:60,n:48,r:[8,15]},
  sakura:{cx:100,cy:108,rx:90,ry:44,n:80,r:[7,15]},
  oak:{cx:100,cy:100,rx:86,ry:62,n:74,r:[12,24]}
};
function canopy(type,R){
  const s=SHAPE[type],P=PAL[type].leaf;let o='';
  o+=`<ellipse cx="${s.cx}" cy="${s.cy+4}" rx="${s.rx*.86}" ry="${s.ry*.8}" fill="${P[1]}"/>`;
  const bl=[];
  for(let i=0;i<s.n;i++){
    const a=R()*6.283,d=Math.sqrt(R());
    const x=s.cx+s.rx*d*Math.cos(a),y=s.cy+s.ry*d*Math.sin(a);
    const r=s.r[0]+R()*(s.r[1]-s.r[0]);
    const t=(y-(s.cy-s.ry))/(2*s.ry);
    let k=Math.floor((1-t)*P.length*.92+(R()-.5)*2.2);
    k=Math.max(0,Math.min(P.length-1,k));
    bl.push([x,y,r,k,R(),R()]);
  }
  bl.sort((a,b)=>b[1]-a[1]);
  for(const[x,y,r,k,u,v]of bl)o+=`<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(r*(1+u*.35))}" ry="${f1(r*(.78+v*.25))}" fill="${P[k]}" opacity=".94"/>`;
  for(let i=0;i<14;i++){
    const a=R()*6.283,d=Math.sqrt(R())*.8;
    o+=`<circle cx="${f1(s.cx+s.rx*d*Math.cos(a))}" cy="${f1(s.cy-s.ry*.25+s.ry*d*Math.sin(a)*.7)}" r="${f1(2+R()*3)}" fill="${P[5]}" opacity=".85"/>`;
  }
  if(type==='sakura')for(let i=0;i<7;i++)o+=`<ellipse cx="${f1(100+(R()-.5)*190)}" cy="${f1(150+R()*70)}" rx="3" ry="2" fill="#f7c3cd" opacity=".75"/>`;
  return o;
}
function trunk(type,R,dead){
  const col=dead?PAL[type].dead:PAL[type].bark;
  const lean=(R()-.5)*10;
  const br=(x1,y1,x2,y2,w)=>`<path d="M${f1(x1)} ${f1(y1)} Q ${f1((x1+x2)/2+(R()-.5)*10)} ${f1((y1+y2)/2-R()*6)} ${f1(x2)} ${f1(y2)}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
  let o='';let tips=[];
  if(type==='birch'){
    const top=104,xAt=y=>100+lean*((236-y)/132);
    o+=`<path d="M100 236 C ${99+lean*.3} 205, ${101+lean} 160, ${100+lean} ${top}" stroke="${col}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
    for(let i=0;i<10;i++){const y=226-i*12;o+=`<path d="M${f1(xAt(y)-3)} ${y} l ${f1(3+R()*3)} ${f1(R()-.3)}" stroke="${dead?'#5d574d':'#3f362f'}" stroke-width="1.5" stroke-linecap="round"/>`}
    const tx=xAt(top);
    o+=br(xAt(160),160,tx-24,128,2.6)+br(xAt(140),140,tx+24,110,2.6)+br(tx,top,tx-4,56,2.8);
    tips=[[tx-24,128],[tx+24,110],[tx-4,56]];
  }else if(type==='sakura'){
    const tx=100+lean*.5;
    o+=`<path d="M100 237 C ${96+lean*.2} 205, ${104+lean} 180, ${tx} 148" stroke="${col}" stroke-width="13" fill="none" stroke-linecap="round"/>`;
    o+=`<path d="M97 232 C 95 205, 100 180, ${tx-2} 152" stroke="rgba(255,255,255,.14)" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    o+=`<ellipse cx="100" cy="235" rx="14" ry="4" fill="${col}"/>`;
    o+=br(tx,150,66,116,6.5)+br(tx,150,134,110,6.5)+br(tx,148,100,92,5.5)+br(66,116,40,104,3.4)+br(66,116,84,88,3.2)+br(134,110,160,98,3.4)+br(134,110,118,86,3.2);
    tips=[[40,104],[84,88],[160,98],[118,86],[100,92]];
  }else{
    const tx=100+lean*.4;
    o+=`<path d="M100 237 C ${97} 205, ${103+lean*.4} 175, ${tx} 138" stroke="${col}" stroke-width="21" fill="none" stroke-linecap="round"/>`;
    o+=`<path d="M94 232 C 92 205, 97 175, ${tx-4} 142" stroke="rgba(255,255,255,.12)" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    o+=`<path d="M86 236 Q 76 234 66 238 M114 236 Q 126 234 136 238" stroke="${col}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
    o+=br(tx,140,58,106,10)+br(tx,140,142,104,10)+br(tx,136,100,84,8)+br(58,106,34,92,5)+br(142,104,168,90,5);
    tips=[[34,92],[168,90],[100,84],[58,106],[142,104]];
  }
  if(dead){
    for(const[x,y]of tips){for(let i=0;i<3;i++){const a=(R()-.5)*2.4-1.57;const L=10+R()*16;o+=`<path d="M${f1(x)} ${f1(y)} l ${f1(Math.cos(a)*L)} ${f1(Math.sin(a)*L)}" stroke="${col}" stroke-width="1.6" stroke-linecap="round" fill="none"/>`}}
  }
  return o;
}
function sprout(){
  return `<ellipse cx="100" cy="235" rx="16" ry="5" fill="#5b4636"/><path d="M100 235 C100 226 100 219 100 211" stroke="#6f8f3c" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="93" cy="211" rx="9" ry="4.5" fill="#8fb04e" transform="rotate(-30 93 211)"/><ellipse cx="107" cy="209" rx="9" ry="4.5" fill="#a3c35d" transform="rotate(28 107 209)"/>`;
}
const _cache=new Map();
function treeInner(type,seed,dead){
  const key=type+seed+(dead?'d':'a');
  if(_cache.has(key))return _cache.get(key);
  const R=rng(seed*9973+type.length*131+(type==='oak'?7:0));
  let o=`<g class="sw${dead?' stiff':''}" style="animation-delay:-${seed%7}s">`;
  o+=`<ellipse cx="100" cy="235" rx="${type==='oak'?46:type==='sakura'?40:28}" ry="6.5" fill="rgba(28,22,12,.34)"/>`;
  o+=`<g class="ts"><g class="tr">${trunk(type,R,dead)}</g>`;
  if(dead){
    for(let i=0;i<9;i++)o+=`<ellipse cx="${f1(100+(R()-.5)*70)}" cy="${f1(232+R()*5)}" rx="${f1(3+R()*3)}" ry="1.7" fill="${['#8a6b3f','#a07d44','#7a6140'][i%3]}" opacity=".9"/>`;
  }else o+=`<g class="cn">${canopy(type,R)}</g>`;
  o+=`</g><g class="sp">${sprout()}</g></g>`;
  _cache.set(key,o);return o;
}
const treeSVG=(type,seed,dead,cls='')=>`<svg viewBox="0 0 200 240" class="${cls}" aria-hidden="true">${treeInner(type,seed,dead)}</svg>`;
const thumbSVG=(type,seed,dead)=>`<svg viewBox="12 28 176 212" aria-hidden="true">${treeInner(type,seed,dead).replace(/class="sw/,'class="sw stiff')}</svg>`;

/* ---------- forest island ---------- */
function smoothBlob(cx,cy,rx,ry,R,n=26,amp=.06){
  const pts=[];for(let i=0;i<n;i++){const a=i/n*6.283,k=1+(R()-.5)*2*amp;pts.push([cx+rx*k*Math.cos(a),cy+ry*k*Math.sin(a)])}
  const m=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2];let d='';
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n],mm=m(p,q);if(i===0){const s=m(pts[n-1],p);d+=`M${f1(s[0])} ${f1(s[1])}`}d+=` Q${f1(p[0])} ${f1(p[1])} ${f1(mm[0])} ${f1(mm[1])}`}
  return d+'Z';
}
function slot(i){
  const cx=350,cy=240,rx=262,ry=76;let r,a;
  if(i<24){r=.16+.84*Math.sqrt((i+.5)/24);a=i*2.39996}
  else{const R=rng(i*7919);r=Math.sqrt(R())*.98;a=R()*6.283}
  return [cx+rx*r*Math.cos(a),cy+ry*r*Math.sin(a)];
}
const BASE={birch:.4,sakura:.47,oak:.6};
function dockSVG(tx,ty,rot,len){
  let o=`<g transform="translate(${tx} ${ty}) rotate(${rot})">`;
  for(let i=0;i<len;i++)o+=`<rect x="${i*10}" y="0" width="9" height="15" fill="${i%2?'#8d6c47':'#9a7850'}"/>`;
  o+=`<rect x="0" y="15" width="${len*10}" height="4" fill="#5a4330"/>`;
  for(let i=1;i<len;i+=3)o+=`<rect x="${i*10}" y="19" width="4" height="12" fill="#4a3727"/>`;
  return o+'</g>';
}
function forestSVG(trees,opt={}){
  const R=rng(42);
  let o=`<svg viewBox="0 0 700 410" role="img" aria-label="Your forest">`;
  o+=`<ellipse cx="350" cy="356" rx="305" ry="48" fill="#e8a070" opacity=".24" filter="url(#blur6)"/>`;
  for(let i=0;i<5;i++)o+=`<ellipse cx="350" cy="${300+i*9}" rx="${322+i*14}" ry="${108+i*7}" fill="none" stroke="rgba(255,236,210,${.2-i*.03})" stroke-width="1.4"/>`;
  o+=`<ellipse cx="365" cy="365" rx="270" ry="34" fill="#293b34" opacity=".22" filter="url(#blur6)"/>`;
  o+=`<path d="${smoothBlob(350,270,300,100,R,30,.04)}" fill="url(#gCliff)"/>`;
  o+=`<path d="M78 277 Q350 385 635 274 Q602 351 460 364 Q254 383 118 330Z" fill="#302f2b" opacity=".24"/>`;
  o+=`<path d="${smoothBlob(350,246,296,98,R,30,.045)}" fill="url(#gGrass)"/>`;
  o+=`<path d="M95 238 Q290 140 500 196 Q590 218 623 245" stroke="#f0e8ba" stroke-width="8" fill="none" opacity=".20" stroke-linecap="round"/>`;
  for(let i=0;i<90;i++){const x=115+R()*470,y=205+R()*103;o+=`<path d="M${f1(x)} ${f1(y)} q 3 -5 8 -6" fill="none" stroke="${['#e6d49b','#637b45','#bac281'][i%3]}" stroke-width="${f1(1+R()*2)}" opacity=".34"/>`;}
  o+=`<path d="${smoothBlob(350,238,262,70,R,24,.07)}" fill="#8f9c4c" opacity=".55"/>`;
  for(let i=0;i<22;i++){const a=R()*6.283,rr=.96+R()*.06;o+=`<ellipse cx="${f1(350+296*rr*Math.cos(a))}" cy="${f1(246+98*rr*Math.sin(a)+(Math.sin(a)>0?8:0))}" rx="${f1(7+R()*10)}" ry="${f1(4+R()*6)}" fill="${['#7d6c5d','#6a5a4d','#9a8672'][i%3]}"/>`}
  o+=`<path d="M318 336 C 352 304, 420 316, 470 284 S 566 252, 612 242" stroke="#e5d1a1" stroke-width="12" fill="none" stroke-linecap="round" opacity=".72"/>`;
  o+=dockSVG(112,322,-12,11)+dockSVG(520,326,9,11);
  o+=`<path d="M290 378 Q316 394 346 378 Q318 384 290 378Z" fill="#4a3426"/><path d="M306 376 l 26 -14" stroke="#3a281c" stroke-width="2"/>`;
  const n=trees.length;const f=n>24?Math.max(.6,Math.sqrt(24/n)):1;
  const items=trees.map((t,i)=>{const[x,y]=slot(i);const dep=.82+.3*(y-160)/156;return{t,i,x,y,s:BASE[t.type]*dep*f}}).sort((a,b)=>a.y-b.y);
  for(const{t,i,x,y,s}of items){
    const isNew=opt.newId===t.id;
    let cls='',style='',inner;
    if(opt.reveal){
      const dly=(i*.42).toFixed(2);
      if(t.status==='dead'){
        inner=`<g class="pop" style="animation-delay:${dly}s"><g class="fadeout" style="animation-delay:${(+dly+1.1).toFixed(2)}s">${treeInner(t.type,t.seed,false)}</g><g class="fadein" style="animation-delay:${(+dly+1.1).toFixed(2)}s">${treeInner(t.type,t.seed,true)}</g></g>`;
      }else inner=`<g class="pop" style="animation-delay:${dly}s">${treeInner(t.type,t.seed,false)}</g>`;
    }else inner=isNew?`<g class="pop">${treeInner(t.type,t.seed,false)}</g>`:treeInner(t.type,t.seed,t.status==='dead');
    o+=`<g class="tgrp" data-id="${t.id}" transform="translate(${f1(x-100*s)} ${f1(y-233*s)}) scale(${f1(s*100)/100})"><rect class="hit" x="28" y="40" width="144" height="198" fill="transparent"/><ellipse class="selring" cx="100" cy="236" rx="${t.type==='oak'?58:48}" ry="10" fill="none" stroke="#fdf1dd" stroke-width="3" stroke-dasharray="6 5"/>${inner}</g>`;
  }
  return o+'</svg>';
}

/* =========================================================
   state & storage
   ========================================================= */
const KEY='focusforest.v1';
let store=null;
function loadStore(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function demoTrees(){
  const L=[['sakura',6,9,1],['birch',6,14,1],['oak',5,10,1],['sakura',5,16,1],['birch',4,9,0],['birch',4,11,1],['sakura',3,15,1],['sakura',3,20,1],['birch',2,8,1],['sakura',2,13,0],['birch',1,10,1],['sakura',1,17,1],['sakura',0,9,1],['birch',0,14,1]];
  const d0=new Date();d0.setHours(0,0,0,0);const now=Date.now();
  return L.map((r,i)=>{let t=d0.getTime()-r[1]*864e5+r[2]*36e5;if(t>now)t=now-(L.length-i)*6e4;
    return{id:i+1,type:r[0],min:TYPES[r[0]].min,status:r[3]?'alive':'dead',t,seed:(i+3)*37+11}});
}
function initStore(){
  store=loadStore();
  if(!store||!Array.isArray(store.trees)){store={trees:[],settings:{fast:false,leave:false,sound:true},active:null,nextId:1};save()}
  store.settings=Object.assign({fast:false,leave:false,sound:true},store.settings||{});
  store.nextId=Math.max(Number(store.nextId)||1,...store.trees.map(t=>(Number(t.id)||0)+1));
}
function addTree(type,status){
  const t={id:store.nextId++,type,min:TYPES[type].min,status,t:Date.now(),seed:Math.floor(Math.random()*90000)+10};
  store.trees.push(t);save();return t;
}

function statsOf(){
  const trees=store.trees,alive=trees.filter(t=>t.status==='alive'),dead=trees.length-alive.length;
  const minutes=alive.reduce((s,t)=>s+t.min,0);
  const rate=trees.length?Math.round(alive.length/trees.length*100):0;
  const key=d=>{const x=new Date(d);return x.getFullYear()+'-'+x.getMonth()+'-'+x.getDate()};
  const days={};alive.forEach(t=>{const k=key(t.t);days[k]=(days[k]||0)+t.min});
  const week=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);week.push({d,min:days[key(d)]||0,today:i===0})}
  let streak=0;const c=new Date();c.setHours(12,0,0,0);if(!days[key(c)])c.setDate(c.getDate()-1);
  while(days[key(c)]){streak++;c.setDate(c.getDate()-1)}
  const by={};ORDER.forEach(k=>by[k]={ok:0,no:0});trees.forEach(t=>by[t.type][t.status==='alive'?'ok':'no']++);
  return{count:alive.length,dead,minutes,rate,week,streak,by,total:trees.length};
}

/* =========================================================
   timer
   ========================================================= */
const S={sel:'sakura',state:'idle',elapsed:0,breakLeft:120,seed:PREVIEW_SEED.sakura,hiddenAt:0};
const speed=()=>store.settings.fast?60:1;
const total=()=>TYPES[S.sel].min*60;
const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const C=2*Math.PI*134;

function mountMainTree(){
  $('#treeBox').innerHTML=`<div class="layer" id="liveLayer">${treeSVG(S.sel,S.seed,false,'tsvg')}</div><div class="layer dead-layer" id="deadLayer">${treeSVG(S.sel,S.seed,true,'')}</div>`;
  growTo(S.state==='running'||S.state==='paused'?S.elapsed/total():1,true);
}
function growTo(g,instant){
  const sv=$('#treeBox .tsvg');if(!sv)return;
  g=Math.max(0,Math.min(1,g));
  let s,c,sp;
  if(g>=1){s=1;c=1;sp=0}
  else if(g<.12){s=.05;c=0;sp=1}
  else{const u=(g-.12)/.88;s=.3+.7*Math.pow(u,.75);c=Math.min(1,Math.max(0,(g-.12)/.6));sp=0}
  if(instant)sv.style.transition='none';
  sv.style.setProperty('--s',s);sv.style.setProperty('--c',c);sv.style.setProperty('--sp',sp);
  if(instant){void sv.getBoundingClientRect();sv.style.transition=''}
}
function renderDurs(){
  const lock=S.state==='running'||S.state==='paused';
  $('#durs').innerHTML=ORDER.map(k=>`<button class="dur brush${S.sel===k?' on':''}" data-type="${k}" ${lock?'disabled':''} aria-pressed="${S.sel===k}" style="--r:36px">${thumbSVG(k,PREVIEW_SEED[k],false)}<div><b>${TYPES[k].min} min</b><span>${TYPES[k].name}</span></div></button>`).join('');
}
function updateTimerUI(){
  const T=total(),rem=S.state==='running'||S.state==='paused'?T-S.elapsed:T;
  const frac=S.state==='idle'||S.state==='done'||S.state==='failed'?.95:Math.max(.003,rem/T*.95);
  $('#ringArc').setAttribute('stroke-dasharray',`${(C*frac).toFixed(1)} ${C.toFixed(1)}`);
  $('#tNum').textContent=fmt(S.state==='idle'||S.state==='done'||S.state==='failed'?T:rem);
  let lbl='Ready to focus',st='Start',dis=false;
  if(S.state==='running'){lbl='';st='';dis=true}
  if(S.state==='paused'){lbl='Break · '+fmt(S.breakLeft).replace(/^0/,'');st='Resume'}
  if(S.state==='done'){lbl='Tree planted';st='Start';dis=true}
  if(S.state==='failed'){lbl='Tree withered';st='Start';dis=true}
  $('#startTxt').textContent=st;$('#btnStart').disabled=dis;
  $('#ring').classList.toggle('active',S.state!=='idle');
  $('#btnStart').classList.toggle('center-start',S.state==='idle'||S.state==='paused');
  $('#btnStart').classList.toggle('session-start',S.state!=='idle'&&S.state!=='paused');
  $('#btnStart').classList.toggle('resume-start',S.state==='paused');
  const act=S.state==='running'||S.state==='paused';
  $('#btnStop').disabled=!act;
  $('#btnBreak').disabled=!(S.state==='running'&&S.breakLeft>1)&&S.state!=='paused';
  $('#breakTxt').textContent=S.state==='paused'?'Resume':'Break';
  const live=$('#liveT');
  if(act){live.textContent=fmt(rem);live.classList.add('on');document.title=fmt(rem)+' · focusforest'}
  else{live.classList.remove('on');document.title='focusforest'}
  if(act)growTo(S.elapsed/T);
}
function startSession(){
  if(S.state==='paused'){S.state='running';if(store.active){store.active.state='running';store.active.savedAt=Date.now();save()}last=Date.now();updateTimerUI();return}
  if(S.state!=='idle')return;
  S.state='running';S.elapsed=0;S.breakLeft=store.settings.fast?24:120;S.seed=Math.floor(Math.random()*90000)+10;
  store.active={type:S.sel,startedAt:Date.now(),savedAt:Date.now(),elapsed:0,breakLeft:S.breakLeft,state:'running',seed:S.seed,fast:store.settings.fast};save();
  mountMainTree();growTo(0,true);renderDurs();updateTimerUI();last=Date.now();
  if(ac&&ac.state==='suspended')ac.resume();
}
function pauseSession(){
  if(S.state==='running'&&S.breakLeft>1){S.state='paused';if(store.active){Object.assign(store.active,{state:'paused',elapsed:S.elapsed,breakLeft:S.breakLeft,savedAt:Date.now()});save()}updateTimerUI()}
  else if(S.state==='paused'){S.state='running';if(store.active){Object.assign(store.active,{state:'running',elapsed:S.elapsed,savedAt:Date.now()});save()}last=Date.now();updateTimerUI()}
}
function resetIdle(){
  S.state='idle';S.elapsed=0;S.seed=PREVIEW_SEED[S.sel];
  mountMainTree();renderDurs();updateTimerUI();
}
function complete(){
  const type=S.sel;S.state='done';S.elapsed=total();store.active=null;
  const t=addTree(type,'alive');growTo(1);updateTimerUI();
  const sv=$('#treeBox .tsvg');if(sv){sv.classList.remove('bounce');void sv.getBoundingClientRect();sv.classList.add('bounce')}
  tone([523,659,784,1047],1.1);
  closeModal();renderForestSurfaces(t.id);
  toast(`${TYPES[type].name} tree planted.`);
  setTimeout(()=>{if(S.state==='done')resetIdle()},4800);
}
function wither(msg){
  const type=S.sel;if(S.state!=='running'&&S.state!=='paused')return;
  S.state='failed';store.active=null;
  const t=addTree(type,'dead');
  $('#treeBox .tsvg')?.classList.add('wilt');$('#deadLayer')?.classList.add('on');
  tone([330,262,196],1.4);
  closeModal();updateTimerUI();renderForestSurfaces(t.id,true);
  toast(msg||'Focus session ended early. Your tree withered.',true);
  setTimeout(()=>{if(S.state==='failed')resetIdle()},4800);
}
let last=Date.now(),lastSaved=0;
function tick(){
  const now=Date.now(),dt=(now-last)/1000;last=now;
  if(S.state==='running'){S.elapsed+=Math.max(0,dt)*speed();if(S.elapsed>=total()){complete();return}updateTimerUI()}
  else if(S.state==='paused'){S.breakLeft-=Math.max(0,dt);if(S.breakLeft<=0){wither('Your break was too long. Your tree withered.');return}updateTimerUI()}
  if(store?.active && now-lastSaved>1500){Object.assign(store.active,{elapsed:S.elapsed,breakLeft:S.breakLeft,state:S.state,savedAt:now});save();lastSaved=now}
}
setInterval(tick,250);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){S.hiddenAt=Date.now()}
  else if(S.hiddenAt){
    const away=(Date.now()-S.hiddenAt)/1000;S.hiddenAt=0;
    if(store.settings.leave&&S.state==='running'&&away>20)wither('You left your focus session. Your tree withered.');
  }
});

/* ---------- audio ---------- */
let ac;
function tone(freqs,dur){
  if(!store.settings.sound)return;
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;
    freqs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t+i*.18);g.gain.linearRampToValueAtTime(.1,t+i*.18+.03);g.gain.exponentialRampToValueAtTime(.001,t+i*.18+dur);
      o.connect(g).connect(ac.destination);o.start(t+i*.18);o.stop(t+i*.18+dur+.05)})}catch(e){}
}

function renderForestTab(){
  const s=statsOf();
  $('#forestChips').innerHTML=`<span>${s.count} living trees</span><span>${s.dead} withered</span><span>${s.minutes} focus minutes</span>`;
  const list=[...store.trees].sort((a,b)=>b.t-a.t);
  $('#fvList').innerHTML=`<h2 class="hand">All Trees</h2><div class="grid">${list.map(t=>`<button class="tile${t.status==='dead'?' dead':''}${selTree===t.id?' on':''}" data-id="${t.id}">${thumbSVG(t.type,t.seed,t.status==='dead')}${TYPES[t.type].name}<small>${t.status==='dead'?'withered':t.min+' min'} · ${dateTR(t.t)}</small></button>`).join('')||'<p>No trees yet. Start your first focus session.</p>'}</div>`;
  renderInfo();
}
function renderInfo(){
  const t=store.trees.find(x=>x.id===selTree);
  if(!t){$('#fvInfo').innerHTML=`<h2 class="hand">Every Tree Has a Story</h2><p>Tap a tree in the forest or select one from the list. Use time-lapse to watch your forest grow.</p>`;return}
  const dead=t.status==='dead';
  $('#fvInfo').innerHTML=`<div class="big">${treeSVG(t.type,t.seed,dead)}</div><span class="badge${dead?' dead':''}">${dead?'Withered':'Grown'}</span><h2 class="hand">${TYPES[t.type].name} · ${t.min} min</h2><p>${dateTR(t.t)}, ${timeTR(t.t)}. ${dead?'This tree withered because the focus session ended early.':TYPES[t.type].blurb}</p>`;
}
function renderStatsTab(){
  const s=statsOf(),max=Math.max(60,...s.week.map(w=>w.min));
  const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  $('#bars').innerHTML=s.week.map(w=>`<div class="col${w.today?' today':''}"><span class="v">${w.min?w.min+' min':''}</span><div class="bar" style="height:${w.min?Math.max(4,w.min/max*100*.78):1.5}%"></div><span>${w.today?'Today':dn[w.d.getDay()]}</span></div>`).join('');
  const wk=s.week.reduce((a,w)=>a+w.min,0),best=s.week.reduce((a,w)=>w.min>a.min?w:a,s.week[0]);
  $('#weekNote').textContent=wk?`In the last seven days, ${wk} minutes of focus.${best.min?` Your most productive day was ${best.d.toLocaleDateString('en-US',{weekday:'long'})}.`:''}`:'No focus sessions in the last seven days. Plant your first tree.';
  const h=Math.floor(s.minutes/60),m=s.minutes%60;
  $('#tiles').innerHTML=[[h?`${h}h ${m}m`:`${m} min`,'total focus'],[s.count,'trees planted'],['%'+s.rate,'success rate'],[s.streak,'day streak']].map(x=>`<div class="tile2 brush" style="--r:30px"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
  $('#typeRows').innerHTML=ORDER.map(k=>{const b=s.by[k],t=b.ok+b.no||1;return`<div class="trow">${thumbSVG(k,PREVIEW_SEED[k],false)}<div class="nm"><b>${TYPES[k].name}</b><span>${TYPES[k].min} min focus</span></div><div class="meter"><i class="ok" style="width:${b.ok/Math.max(1,s.total)*100*1.0}%"></i><i class="no" style="width:${b.no/Math.max(1,s.total)*100}%"></i></div><div class="cnt">${b.ok} grown${b.no?` · ${b.no} withered`:''}</div></div>`}).join('');
}
function renderForestSurfaces(newId,wasDead){
  renderMini(wasDead?undefined:newId);renderMiniStats();renderBig({newId:wasDead?undefined:newId});renderForestTab();renderStatsTab();
}

/* ---------- tabs ---------- */
const TABS=['forest','focus','stats'];
let tab='focus';
function setTab(t){
  tab=t;
  TABS.forEach(k=>{$('#v-'+k).hidden=k!==t});
  $$('.nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  $$('#dots button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===t));
  if(t==='forest'){renderBig();renderForestTab()}
  if(t==='stats')renderStatsTab();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- toast + modal ---------- */
let toastT;
function toast(msg,bad){const el=$('#toast');el.textContent=msg;el.classList.toggle('bad',!!bad);el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),4200)}
function openModal(html){$('#sheet').innerHTML=html;$('#modal').hidden=false;$('#sheet').querySelector('button')?.focus()}
function closeModal(){$('#modal').hidden=true}
function settingsModal(){
  const st=store.settings;
  const row=(id,t,d,on)=>`<div class="row"><div>${t}<small>${d}</small></div><button class="sw-t" role="switch" aria-checked="${on}" data-set="${id}" aria-label="${t}"></button></div>`;
  openModal(`<h3>Settings</h3>
  ${row('leave','Wither tree when leaving the tab','If you leave this tab for more than 20 seconds during focus.',st.leave)}
  ${row('sound','Sounds','Play a short sound when a tree grows or withers.',st.sound)}
  ${row('fast','Quick mode (testing)','One minute takes one second. Preview tree growth instantly.',st.fast)}
  <div class="acts"><button data-act="reset" class="dng">Reset Forest</button><button data-act="demo">Sample Forest</button><button data-act="close" class="pri">Done</button></div>`);
}
function stopModal(){
  openModal(`<h3>End your focus session?</h3><p>If you stop now, this tree will wither and remain in your forest.</p><div class="acts"><button data-act="close" class="pri">Keep Focusing</button><button data-act="giveup" class="dng">Stop and Wither Tree</button></div>`);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-id],[role=button]');if(!b)return;
  if(b.dataset.tab)return setTab(b.dataset.tab);
  if(b.dataset.go)return setTab(b.dataset.go);
  if(b.id==='miniForest')return setTab('forest');
  if(b.dataset.type&&!b.disabled){S.sel=b.dataset.type;S.seed=PREVIEW_SEED[S.sel];renderDurs();mountMainTree();updateTimerUI();return}
  if(b.id==='btnStart')return startSession();
  if(b.id==='btnBreak')return pauseSession();
  if(b.id==='btnStop')return stopModal();
  if(b.id==='btnSet')return settingsModal();
  if(b.id==='btnReplay'){selTree=null;renderInfo();renderBig({reveal:true});const ms=store.trees.length*420+1800;b.disabled=true;setTimeout(()=>{b.disabled=false;renderBig()},ms);return}
  if(b.dataset.set){const k=b.dataset.set;store.settings[k]=!store.settings[k];save();b.setAttribute('aria-checked',store.settings[k]);return}
  const act=b.dataset.act;
  if(act==='close')return closeModal();
  if(act==='giveup'){closeModal();return wither('You ended your focus session. Your tree withered.')}
  if(act==='reset'){openModal(`<h3>Reset Forest?</h3><p>All your trees and statistics will be permanently deleted. This cannot be undone.</p><div class="acts"><button data-act="close" class="pri">Cancel</button><button data-act="reset-confirm" class="dng">Yes, Delete</button></div>`);return}
  if(act==='reset-confirm'){store.trees=[];store.nextId=1;save();selTree=null;closeModal();renderForestSurfaces();toast('Your forest has been reset. Start with a new tree.');return}
  if(act==='demo'){store.trees=demoTrees();store.nextId=100;save();selTree=null;closeModal();renderForestSurfaces();toast('Sample forest loaded.');return}
});
$('#bigForest').addEventListener('click',e=>{const g=e.target.closest('.tgrp');if(!g)return;selTree=+g.dataset.id;markSel();renderInfo();$$('#fvList .tile').forEach(t=>t.classList.toggle('on',+t.dataset.id===selTree))});
$('#fvList').addEventListener('click',e=>{const t=e.target.closest('.tile');if(!t)return;selTree=+t.dataset.id;markSel();renderInfo();$$('#fvList .tile').forEach(x=>x.classList.toggle('on',+x.dataset.id===selTree))});
$('#miniForest').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setTab('forest')}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ---------- petals ---------- */
function initPetals(){
  $('#petals').innerHTML=Array.from({length:7},(_,i)=>`<i style="left:${10+i*12}%;animation-duration:${7+i%4*2}s;animation-delay:${-i*1.7}s"></i>`).join('');
}

/* ---------- boot ---------- */
buildScene();mainIsland();initStore();initPetals();
let bootMsg='';
if(store.active){
  // Reopen the page without losing a legitimate focus session.
  const a=store.active, now=Date.now(), delta=Math.max(0,(now-(a.savedAt||now))/1000);
  if(TYPES[a.type]){
    S.sel=a.type;S.seed=a.seed||PREVIEW_SEED[a.type];
    S.elapsed=Math.max(0,Number(a.elapsed)||0)+(a.state==='running'?delta*(a.fast?60:1):0);
    S.breakLeft=(Number(a.breakLeft)||120)-(a.state==='paused'?delta:0);
    S.state=a.state==='paused'?'paused':'running';
    if(S.elapsed>=total()){
      store.active=null;addTree(S.sel,'alive');S.state='idle';S.elapsed=0;
      bootMsg='Focus complete! Your new tree has joined the forest.';
    }else if(S.state==='paused'&&S.breakLeft<=0){
      store.active=null;addTree(S.sel,'dead');S.state='idle';S.elapsed=0;
      bootMsg='Break time expired; your tree withered.';
    }else{Object.assign(store.active,{elapsed:S.elapsed,breakLeft:S.breakLeft,savedAt:now});save();}
  }else{store.active=null;save()}
}

renderDurs();mountMainTree();updateTimerUI();
renderMini();renderMiniStats();renderBig();renderForestTab();renderStatsTab();setTab('focus');
if(bootMsg)setTimeout(()=>toast(bootMsg,true),600);
</script>
<script>if ("serviceWorker" in navigator && location.protocol.startsWith("http")) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.warn));</script>
